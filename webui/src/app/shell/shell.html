<p-confirmDialog></p-confirmDialog>

<app-queue-properties-dialog
  [queue]="queueDialogTarget()"
  [visible]="showQueueDialog()"
  (visibleChange)="showQueueDialog.set($event)"
  (save)="onQueueDialogSave($event)"
></app-queue-properties-dialog>

<app-transfer-properties-dialog
  [transfer]="transferPropertiesTarget()"
  [visible]="showTransferPropertiesDialog()"
  (visibleChange)="showTransferPropertiesDialog.set($event)"
  (save)="onTransferPropertiesSave($event)"
></app-transfer-properties-dialog>

<app-new-transfer-dialog
  [queues]="queuesStore.queues()"
  [transferClasses]="transferClasses()"
  [defaultQueueUuid]="queuesStore.selectedQueueUuid()"
  [visible]="showNewTransferDialog()"
  (visibleChange)="showNewTransferDialog.set($event)"
  (save)="onNewTransferSave($event)"
></app-new-transfer-dialog>

<app-settings-dialog
  [visible]="showSettingsDialog()"
  (visibleChange)="showSettingsDialog.set($event)"
></app-settings-dialog>

<!-- Self-managed, no bindings: visibility is derived internally from CaptchaSocketService events. -->
<app-captcha-dialog></app-captcha-dialog>

<header class="shell-header">
  <img src="img/logo.png" alt="FatRat" class="shell-logo" />
</header>

<p-toolbar>
  <ng-template #start>
    <span class="toolbar-group">
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-new-transfer" aria-label="New Transfer" pTooltip="New Transfer" tooltipPosition="bottom" (click)="openNewTransferDialog()"><i class="pi pi-plus" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-delete" aria-label="Delete" pTooltip="Delete" tooltipPosition="bottom" [disabled]="!available.delete" (click)="actions.deleteSelected(false)"><i class="pi pi-trash" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-delete-with-data" aria-label="Delete with Data" pTooltip="Delete with Data" tooltipPosition="bottom" [disabled]="!available.delete" (click)="actions.deleteSelected(true)"><i class="pi pi-eraser" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-delete-completed" aria-label="Delete Completed" pTooltip="Delete Completed" tooltipPosition="bottom" (click)="actions.deleteCompleted()"><i class="pi pi-check-circle" pButtonIcon></i></button>
    </span>
    <span class="toolbar-group">
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-resume" aria-label="Resume" pTooltip="Resume" tooltipPosition="bottom" [disabled]="!available.resume" (click)="actions.resume()"><i class="pi pi-play" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-force-resume" aria-label="Force Resume" pTooltip="Force Resume" tooltipPosition="bottom" [disabled]="!available.forceResume" (click)="actions.forceResume()"><i class="pi pi-forward" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-pause" aria-label="Pause" pTooltip="Pause" tooltipPosition="bottom" [disabled]="!available.pause" (click)="actions.pause()"><i class="pi pi-pause" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-properties" aria-label="Properties" pTooltip="Properties" tooltipPosition="bottom" [disabled]="!available.properties" (click)="openTransferPropertiesDialog()"><i class="pi pi-pencil" pButtonIcon></i></button>
    </span>
    <span class="toolbar-group">
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-move-top" aria-label="Move to Top" pTooltip="Move to Top" tooltipPosition="bottom" [disabled]="!available.moveUp" (click)="actions.moveSelected('top')"><i class="pi pi-angle-double-up" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-move-up" aria-label="Move Up" pTooltip="Move Up" tooltipPosition="bottom" [disabled]="!available.moveUp" (click)="actions.moveSelected('up')"><i class="pi pi-angle-up" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-move-down" aria-label="Move Down" pTooltip="Move Down" tooltipPosition="bottom" [disabled]="!available.moveDown" (click)="actions.moveSelected('down')"><i class="pi pi-angle-down" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-move-bottom" aria-label="Move to Bottom" pTooltip="Move to Bottom" tooltipPosition="bottom" [disabled]="!available.moveDown" (click)="actions.moveSelected('bottom')"><i class="pi pi-angle-double-down" pButtonIcon></i></button>
    </span>
    <span class="toolbar-group">
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-new-queue" aria-label="New Queue" pTooltip="New Queue" tooltipPosition="bottom" (click)="openNewQueueDialog()"><i class="pi pi-folder-plus" pButtonIcon></i></button>
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-queue-properties" aria-label="Queue Properties" pTooltip="Queue Properties" tooltipPosition="bottom" [disabled]="!hasSelectedQueue" (click)="openQueuePropertiesDialog()"><i class="pi pi-sliders-h" pButtonIcon></i></button>
    </span>
    <span class="toolbar-group">
      <button pButton type="button" [text]="true" severity="secondary" data-testid="action-settings" aria-label="Settings" pTooltip="Settings" tooltipPosition="bottom" (click)="openSettingsDialog()"><i class="pi pi-cog" pButtonIcon></i></button>
    </span>
  </ng-template>
  <ng-template #end>
    <label id="refresh-interval-label" for="refresh-interval">Refresh every</label>
    <p-select
      inputId="refresh-interval"
      [ariaLabelledBy]="'refresh-interval-label'"
      [options]="allowedIntervals"
      [ngModel]="polling.intervalSeconds()"
      (ngModelChange)="polling.setIntervalSeconds($event)"
    >
      <ng-template let-seconds #selectedItem>{{ seconds }} seconds</ng-template>
      <ng-template let-seconds #item>{{ seconds }} seconds</ng-template>
    </p-select>
  </ng-template>
</p-toolbar>

<p-splitter [panelSizes]="[20, 80]" styleClass="shell-splitter">
  <ng-template #panel>
    <app-queue-list></app-queue-list>
  </ng-template>
  <ng-template #panel>
    <p-tabs [(value)]="activeTab" class="details-tabs">
      <p-tablist>
        <p-tab value="0">Transfers</p-tab>
        <p-tab value="1">Details</p-tab>
        <p-tab value="2">Speed Graphs</p-tab>
        <p-tab value="3">Log</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="0"><app-transfer-table (propertiesRequested)="openTransferPropertiesDialog()"></app-transfer-table></p-tabpanel>
        <p-tabpanel value="1" [lazy]="true">
          <ng-template #content>
            <app-transfer-details></app-transfer-details>
          </ng-template>
        </p-tabpanel>
        <p-tabpanel value="2" [lazy]="true">
          <ng-template #content>
            <app-speed-graphs-tab [active]="activeTab() === '2'"></app-speed-graphs-tab>
          </ng-template>
        </p-tabpanel>
        <p-tabpanel value="3" [lazy]="true">
          <ng-template #content>
            <app-log-tab [active]="activeTab() === '3'"></app-log-tab>
          </ng-template>
        </p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </ng-template>
</p-splitter>
