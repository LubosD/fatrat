<p-confirmDialog></p-confirmDialog>

<app-queue-properties-dialog
  [queue]="queueDialogTarget()"
  [visible]="showQueueDialog()"
  (visibleChange)="showQueueDialog.set($event)"
  (save)="onQueueDialogSave($event)"
></app-queue-properties-dialog>

<app-transfer-properties-dialog
  [transfer]="transferPropertiesTarget()"
  [visible]="showTransferPropertiesDialog()"
  (visibleChange)="showTransferPropertiesDialog.set($event)"
  (save)="onTransferPropertiesSave($event)"
></app-transfer-properties-dialog>

<app-new-transfer-dialog
  [queues]="queuesStore.queues()"
  [transferClasses]="transferClasses()"
  [defaultQueueUuid]="queuesStore.selectedQueueUuid()"
  [visible]="showNewTransferDialog()"
  (visibleChange)="showNewTransferDialog.set($event)"
  (save)="onNewTransferSave($event)"
></app-new-transfer-dialog>

<p-toolbar>
  <ng-template #start>
    <button pButton type="button" data-testid="action-new-transfer" (click)="openNewTransferDialog()">New Transfer</button>
    <button pButton type="button" data-testid="action-new-queue" (click)="openNewQueueDialog()">New Queue</button>
    <button pButton type="button" data-testid="action-queue-properties" [disabled]="!hasSelectedQueue" (click)="openQueuePropertiesDialog()">Queue Properties</button>
    <button pButton type="button" data-testid="action-resume" [disabled]="!hasSelection" (click)="actions.resume()">Resume</button>
    <button pButton type="button" data-testid="action-force-resume" [disabled]="!hasSelection" (click)="actions.forceResume()">Force Resume</button>
    <button pButton type="button" data-testid="action-pause" [disabled]="!hasSelection" (click)="actions.pause()">Pause</button>
    <button pButton type="button" data-testid="action-delete" [disabled]="!hasSelection" (click)="actions.deleteSelected(false)">Delete</button>
    <button pButton type="button" data-testid="action-delete-with-data" [disabled]="!hasSelection" (click)="actions.deleteSelected(true)">Delete with Data</button>
    <button pButton type="button" data-testid="action-properties" [disabled]="!hasSelection" (click)="openTransferPropertiesDialog()">Properties</button>
    <button pButton type="button" data-testid="action-delete-completed" (click)="actions.deleteCompleted()">Delete Completed</button>
    <button pButton type="button" data-testid="action-move-top" [disabled]="!hasSelection" (click)="actions.moveSelected('top')">Move to Top</button>
    <button pButton type="button" data-testid="action-move-up" [disabled]="!hasSelection" (click)="actions.moveSelected('up')">Move Up</button>
    <button pButton type="button" data-testid="action-move-down" [disabled]="!hasSelection" (click)="actions.moveSelected('down')">Move Down</button>
    <button pButton type="button" data-testid="action-move-bottom" [disabled]="!hasSelection" (click)="actions.moveSelected('bottom')">Move to Bottom</button>
  </ng-template>
  <ng-template #end>
    <label id="refresh-interval-label" for="refresh-interval">Refresh every</label>
    <p-select
      inputId="refresh-interval"
      [ariaLabelledBy]="'refresh-interval-label'"
      [options]="allowedIntervals"
      [ngModel]="polling.intervalSeconds()"
      (ngModelChange)="polling.setIntervalSeconds($event)"
    >
      <ng-template let-seconds #selectedItem>{{ seconds }} seconds</ng-template>
      <ng-template let-seconds #item>{{ seconds }} seconds</ng-template>
    </p-select>
  </ng-template>
</p-toolbar>

<p-splitter [panelSizes]="[20, 80]" styleClass="shell-splitter">
  <ng-template #panel>
    <app-queue-list></app-queue-list>
  </ng-template>
  <ng-template #panel>
    <p-tabs value="0" class="details-tabs">
      <p-tablist>
        <p-tab value="0">Transfers</p-tab>
        <p-tab value="1">Details</p-tab>
      </p-tablist>
      <p-tabpanels>
        <p-tabpanel value="0"><app-transfer-table></app-transfer-table></p-tabpanel>
        <p-tabpanel value="1" [lazy]="true"><app-transfer-details></app-transfer-details></p-tabpanel>
      </p-tabpanels>
    </p-tabs>
  </ng-template>
</p-splitter>
