<p-dialog [visible]="visible" (visibleChange)="onDialogVisibleChange($event)" header="Select directory" [modal]="true" [style]="{ width: '34rem' }">
  <div class="picker-path">
    <button pButton type="button" severity="secondary" icon="pi pi-arrow-up" aria-label="Parent directory" data-testid="directory-picker-up" [disabled]="parent() === ''" (click)="navigate(parent())"></button>
    <input pInputText class="picker-path-input" aria-label="Directory path" data-testid="directory-picker-path" [(ngModel)]="pathInput" (keydown.enter)="onGo()" />
    <button pButton type="button" severity="secondary" data-testid="directory-picker-go" (click)="onGo()">Go</button>
  </div>
  @if (error() !== '') {
    <p class="picker-error" role="alert" data-testid="directory-picker-error">{{ error() }}</p>
  }
  <ul class="picker-list" data-testid="directory-picker-list" [class.loading]="loading()">
    @for (entry of entries(); track entry.path) {
      <li>
        <button type="button" class="picker-entry" data-testid="directory-picker-entry" (click)="navigate(entry.path)">
          <i class="pi pi-folder"></i> {{ entry.name }}
        </button>
      </li>
    } @empty {
      @if (!loading()) {
        <li class="picker-empty">No subdirectories</li>
      }
    }
  </ul>
  <div class="picker-hidden">
    <p-checkbox [(ngModel)]="showHidden" [binary]="true" inputId="directory-picker-hidden" (onChange)="onToggleHidden()"></p-checkbox>
    <label for="directory-picker-hidden">Show hidden directories</label>
  </div>
  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" data-testid="directory-picker-cancel" (click)="onCancel()">Cancel</button>
    <button pButton type="button" data-testid="directory-picker-select" [disabled]="path() === ''" (click)="onSelect()">Select</button>
  </ng-template>
</p-dialog>
