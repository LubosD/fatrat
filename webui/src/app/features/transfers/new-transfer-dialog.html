<p-dialog [visible]="visible" (visibleChange)="onDialogVisibleChange($event)" header="New Transfer" [modal]="true" styleClass="fr-dialog" [focusOnShow]="false" (onShow)="focusUrls()">
  <div class="field">
    <label for="new-transfer-queue">Queue</label>
    <p-select inputId="new-transfer-queue" [options]="queues" optionLabel="name" optionValue="uuid" [ngModel]="queueUuid" (ngModelChange)="onQueueChange($event)"></p-select>
  </div>
  <div class="field">
    <label for="new-transfer-urls">URLs (one per line)</label>
    <textarea pTextarea id="new-transfer-urls" class="fr-grow" rows="6" [(ngModel)]="urlsText" #urlsModel="ngModel" (keydown.control.enter)="onSubmitShortcut($event)" (keydown.meta.enter)="onSubmitShortcut($event)"></textarea>
    @if (files.length > 0) {
      <p class="hint">Local files are selected — typed URLs will be ignored.</p>
    }
  </div>
  <div class="field">
    <label for="new-transfer-files">Local files (e.g. .torrent)</label>
    <input #fileInput id="new-transfer-files" type="file" multiple hidden data-testid="new-transfer-file-input" (change)="onFileInputChange(fileInput)" />
    <div class="files fr-grow">
      <div class="file-buttons">
        <button pButton type="button" severity="secondary" icon="pi pi-plus" label="Choose files…" data-testid="new-transfer-choose-files" (click)="fileInput.click()"></button>
        @if (files.length > 0) {
          <button pButton type="button" severity="secondary" [text]="true" data-testid="new-transfer-clear-file" (click)="onClearFiles()">Clear files</button>
        }
      </div>
      @if (files.length > 0) {
        <ul class="file-list" data-testid="new-transfer-file-list">
          @for (f of files; track f) {
            <li>
              <span class="file-name" [title]="f.name">{{ f.name }}</span>
              <button pButton type="button" severity="secondary" [text]="true" [rounded]="true" icon="pi pi-times" [attr.aria-label]="'Remove ' + f.name" data-testid="new-transfer-remove-file" (click)="onRemoveFile(f)"></button>
            </li>
          }
        </ul>
      }
    </div>
  </div>
  <div class="field">
    <label for="new-transfer-target">Target directory</label>
    <p-inputgroup>
      <input pInputText id="new-transfer-target" appPathSuggest [(ngModel)]="target" (keydown.control.enter)="onSubmitShortcut($event)" (keydown.meta.enter)="onSubmitShortcut($event)" />
      <button pButton type="button" severity="secondary" label="Browse…" data-testid="new-transfer-browse" (click)="pickerOpen = true"></button>
    </p-inputgroup>
  </div>
  <div class="field">
    <label for="new-transfer-class">Download as</label>
    <p-select
      inputId="new-transfer-class"
      [options]="transferClasses"
      optionLabel="longName"
      optionValue="shortName"
      [(ngModel)]="targetClass"
      placeholder="Automatically detect"
    ></p-select>
  </div>
  <div class="field">
    <label for="new-transfer-speed-down">Max download speed (KB/s)</label>
    <p-inputnumber inputId="new-transfer-speed-down" [(ngModel)]="speedDown"></p-inputnumber>
  </div>
  <div class="field">
    <label for="new-transfer-speed-up">Max upload speed (KB/s)</label>
    <p-inputnumber inputId="new-transfer-speed-up" [(ngModel)]="speedUp"></p-inputnumber>
  </div>
  <div class="field">
    <p-checkbox [(ngModel)]="paused" [binary]="true" inputId="new-transfer-paused"></p-checkbox>
    <label for="new-transfer-paused">Add paused</label>
  </div>
  <!-- PrimeNG's Dialog detects footer content via a ContentChild query keyed on a
       template-ref variable named "footer" — <p-footer> projection does not work here
       (and Footer from primeng/api isn't a standalone component anyway). -->
  <ng-template #footer>
    <div class="footer">
      @if (error()) {
        <p class="form-error" role="alert" data-testid="new-transfer-error">{{ error() }}</p>
      }
      <button pButton type="button" severity="secondary" [text]="true" data-testid="new-transfer-dialog-cancel" (click)="onCancel()">Cancel</button>
      <button pButton type="button" data-testid="new-transfer-dialog-save" [disabled]="saving()" (click)="onSave()">Add</button>
    </div>
  </ng-template>
</p-dialog>
@if (pickerOpen) {
  <app-directory-picker
    [visible]="pickerOpen"
    (visibleChange)="pickerOpen = $event"
    [initialPath]="target"
    [queueUuid]="queueUuid"
    (selected)="target = $event"
  ></app-directory-picker>
}
