<p-table [value]="store.transfers()" dataKey="uuid" [rowTrackBy]="trackByUuid" [rowHover]="true">
  <ng-template #header>
    <tr>
      <th></th>
      <th>Name</th>
      <th>Progress</th>
      <th>Size</th>
      <th>Down</th>
      <th>Up</th>
      <th>ETA</th>
      <th>Message</th>
    </tr>
  </ng-template>
  <ng-template #body let-transfer>
    <tr [class.selected-row]="store.isSelected(transfer.uuid)">
      <td>
        <input
          type="checkbox"
          [attr.aria-label]="'Select ' + transfer.name"
          [checked]="store.isSelected(transfer.uuid)"
          (change)="store.toggleSelection(transfer.uuid)"
          (click)="$event.stopPropagation()"
        />
      </td>
      <td>{{ transfer.name }}</td>
      <td>
        <p-progressbar [value]="progress(transfer.total, transfer.done)"></p-progressbar>
      </td>
      <td>{{ formatSize(transfer.total) }}</td>
      <td>{{ formatSpeed(transfer.speeds.down) }}</td>
      <td>{{ formatSpeed(transfer.speeds.up) }}</td>
      <td>{{ formatEta(transfer.total, transfer.done, transfer.speeds.down) }}</td>
      <td>{{ transfer.message }}</td>
    </tr>
  </ng-template>
</p-table>
