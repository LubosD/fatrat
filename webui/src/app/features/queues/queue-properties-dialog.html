<p-dialog [visible]="visible" (visibleChange)="onDialogVisibleChange($event)" [header]="dialogHeader" [modal]="true" styleClass="fr-dialog">
  <div class="field">
    <label for="queue-name">Name</label>
    <input pInputText id="queue-name" [(ngModel)]="name" />
  </div>
  <div class="field">
    <label for="queue-default-directory">Target directory</label>
    <p-inputgroup>
      <input pInputText id="queue-default-directory" appPathSuggest [(ngModel)]="defaultDirectory" />
      <button pButton type="button" severity="secondary" label="Browse…" data-testid="queue-browse-default" (click)="pickerTarget = 'defaultDirectory'"></button>
    </p-inputgroup>
  </div>
  <div class="field">
    <label for="queue-move-directory">Move to directory after completion</label>
    <p-inputgroup>
      <input pInputText id="queue-move-directory" appPathSuggest [(ngModel)]="moveDirectory" />
      <button pButton type="button" severity="secondary" label="Browse…" data-testid="queue-browse-move" (click)="pickerTarget = 'moveDirectory'"></button>
    </p-inputgroup>
  </div>
  <div class="field">
    <label for="queue-watch-directory">Watch folder</label>
    <p-inputgroup>
      <input pInputText id="queue-watch-directory" appPathSuggest [(ngModel)]="watchDirectory" placeholder="None" />
      <button pButton type="button" severity="secondary" label="Browse…" data-testid="queue-browse-watch" (click)="pickerTarget = 'watchDirectory'"></button>
    </p-inputgroup>
    <p class="hint">.torrent, .metalink, .meta4, .txt and .magnet files dropped here are added to this queue.</p>
    @if (watchProblem; as problem) {
      <p class="hint warn" data-testid="queue-watch-problem"><i class="pi pi-exclamation-triangle" aria-hidden="true"></i> {{ problem }}</p>
    }
  </div>
  <div class="field">
    <label for="queue-speed-down">Download speed limit (KB/s)</label>
    <p-inputnumber inputId="queue-speed-down" [(ngModel)]="speedDown"></p-inputnumber>
  </div>
  <div class="field">
    <label for="queue-speed-up">Upload speed limit (KB/s)</label>
    <p-inputnumber inputId="queue-speed-up" [(ngModel)]="speedUp"></p-inputnumber>
  </div>
  <div class="field">
    <label for="queue-transfer-down">Max active downloads</label>
    <p-inputnumber inputId="queue-transfer-down" [(ngModel)]="transferDown" [min]="-1"></p-inputnumber>
    <p class="hint">-1 = no limit, 0 = only forced transfers run.</p>
  </div>
  <div class="field">
    <label for="queue-transfer-up">Max active uploads</label>
    <p-inputnumber inputId="queue-transfer-up" [(ngModel)]="transferUp" [min]="-1"></p-inputnumber>
    <p class="hint">-1 = no limit, 0 = only forced transfers run.</p>
  </div>
  <div class="field">
    <p-checkbox [(ngModel)]="upAsDown" [binary]="true" inputId="queue-up-as-down"></p-checkbox>
    <label for="queue-up-as-down">Count uploads as downloads</label>
  </div>
  <!-- PrimeNG's Dialog detects footer content via a ContentChild query keyed on a
       template-ref variable named "footer" — <p-footer> projection does not work here
       (and Footer from primeng/api isn't a standalone component anyway). -->
  <ng-template #footer>
    <button pButton type="button" severity="secondary" [text]="true" data-testid="queue-dialog-cancel" (click)="onCancel()">Cancel</button>
    <button pButton type="button" data-testid="queue-dialog-save" (click)="onSave()">Save</button>
  </ng-template>
</p-dialog>
@if (pickerTarget !== null) {
  <app-directory-picker
    [visible]="true"
    (visibleChange)="$event || (pickerTarget = null)"
    [initialPath]="pickerInitialPath"
    [queueUuid]="queue?.uuid ?? ''"
    (selected)="onDirectoryPicked($event)"
  ></app-directory-picker>
}
